<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="MixCaps">
  <defs>
    <linearGradient id="mcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="mcShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#mcBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#mcShine)"/>
  <!-- sound: three audio bars -->
  <rect x="22" y="50" width="10" height="28" rx="5" fill="#fff"/>
  <rect x="38" y="36" width="10" height="56" rx="5" fill="#fff"/>
  <rect x="54" y="46" width="10" height="36" rx="5" fill="#fff"/>
  <!-- captions: two subtitle lines, with the signature purple drop shadow -->
  <rect x="74" y="47" width="36" height="12" rx="6" fill="#3b0764" opacity=".55" transform="translate(4 0)"/>
  <rect x="74" y="47" width="36" height="12" rx="6" fill="#fff"/>
  <rect x="74" y="69" width="24" height="12" rx="6" fill="#3b0764" opacity=".55" transform="translate(4 0)"/>
  <rect x="74" y="69" width="24" height="12" rx="6" fill="#fff"/>
</svg>
